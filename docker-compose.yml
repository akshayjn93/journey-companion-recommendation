services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: journey
      POSTGRES_PASSWORD: journey
      POSTGRES_DB: journey
    ports:
      - "5432:5432"
    volumes:
      - journey_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://journey:journey@db:5432/journey
      PORT: 3000
    depends_on:
      - db
    ports:
      - "3000:3000"
    command: npm run start

volumes:
  journey_pg:
